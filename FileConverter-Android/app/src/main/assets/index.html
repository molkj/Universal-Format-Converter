<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>文件转换助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f8fa; color: #1f2937; padding-bottom: env(safe-area-inset-bottom);
  }
  .header {
    background: linear-gradient(135deg, #5b7cfa, #7c3aed);
    color: #fff; padding: 18px 16px 22px; border-radius: 0 0 24px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .header .logo {
    width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .header h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .header p { font-size: 12px; opacity: .85; margin-top: 2px; }
  .content { padding: 16px; }

  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 2px 10px rgba(31,41,55,.06); margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; color: #6b7280; font-weight: 600; margin-bottom: 12px; }

  .pick-zone {
    border: 2px dashed #c3cad6; border-radius: 16px; background: #fafbff;
    padding: 34px 16px; text-align: center; cursor: pointer; transition: border-color .2s;
  }
  .pick-zone:active { border-color: #4f6df5; background: #f2f5ff; }
  .pick-zone .icon { font-size: 40px; }
  .pick-zone .t { font-size: 15px; font-weight: 600; color: #374151; margin-top: 8px; }
  .pick-zone .s { font-size: 12px; color: #9ca3af; margin-top: 4px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .thumb { position: relative; border-radius: 10px; overflow: hidden; background: #f3f4f6; }
  .thumb img { width: 100%; height: 86px; object-fit: cover; display: block; }
  .thumb .name {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55);
    color: #fff; font-size: 10px; padding: 3px 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .thumb .del {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 12px; line-height: 1;
  }
  .thumb .state {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.85); font-size: 22px;
  }
  .thumb .state.done { color: #16a34a; }
  .thumb .state.fail { color: #dc2626; font-size: 12px; padding: 4px; text-align: center; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 9px 18px; border-radius: 22px; border: 1.5px solid #d1d5db; background: #fff;
    font-size: 14px; color: #4b5563; cursor: pointer; transition: all .15s;
  }
  .chip.on { border-color: #4f6df5; background: #4f6df5; color: #fff; font-weight: 600; }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .row label { font-size: 13px; color: #4b5563; }
  .row select, .row input[type=range] { flex: 1; margin-left: 12px; }
  .row select {
    border: 1px solid #d1d5db; border-radius: 8px; padding: 7px 10px; font-size: 13px;
    background: #fff; color: #1f2937; max-width: 160px;
  }

  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 16px;
    font-weight: 700; cursor: pointer; transition: opacity .15s;
  }
  .btn.primary { background: linear-gradient(135deg, #4f6df5, #7c3aed); color: #fff; }
  .btn.primary:disabled { opacity: .45; }
  .btn.ghost { background: #eef2ff; color: #4f6df5; margin-top: 8px; }

  .progress-wrap { margin-top: 12px; }
  .progress {
    height: 8px; border-radius: 4px; background: #e5e7eb; overflow: hidden;
  }
  .progress i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #4f6df5, #7c3aed); border-radius: 4px;
    transition: width .2s;
  }
  .progress-text { font-size: 12px; color: #6b7280; margin-top: 6px; text-align: center; }

  .tip { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 14px; line-height: 1.7; }
  .banner {
    background: #fef3c7; color: #92400e; border-radius: 12px; padding: 10px 12px;
    font-size: 12px; line-height: 1.6; margin-bottom: 12px; display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⇄</div>
  <div>
    <h1>文件转换助手</h1>
    <p>手机端 · 图片批量转换 · 全部在本地完成</p>
  </div>
</div>

<div class="content">
  <div class="banner" id="banner"></div>

  <div class="card">
    <h2>① 选择图片</h2>
    <div class="pick-zone" id="pickZone">
      <div class="icon">🖼</div>
      <div class="t">点击选择图片（可多选）</div>
      <div class="s">支持 PNG / JPG / WebP / GIF / BMP</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card">
    <h2>② 转换设置</h2>
    <div class="chips" id="fmtChips">
      <div class="chip" data-fmt="jpg">JPG</div>
      <div class="chip on" data-fmt="png">PNG</div>
      <div class="chip" data-fmt="webp">WebP</div>
    </div>
    <div class="row" style="margin-top:14px">
      <label>尺寸</label>
      <select id="scaleSel">
        <option value="1">保持原尺寸</option>
        <option value="0.75">缩小到 75%</option>
        <option value="0.5">缩小到 50%</option>
      </select>
    </div>
    <div class="row" id="qualityRow">
      <label>质量</label>
      <input type="range" id="qualityRange" min="50" max="100" value="90">
      <label id="qualityVal" style="margin-left:8px;min-width:34px">90%</label>
    </div>
  </div>

  <div class="card">
    <h2>③ 开始转换</h2>
    <button class="btn primary" id="btnConvert" disabled>开始转换（0 张）</button>
    <button class="btn ghost" id="btnClear" style="display:none">清空列表</button>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress"><i id="progressBar"></i></div>
      <div class="progress-text" id="progressText"></div>
    </div>
  </div>

  <div class="tip">
    所有转换均在本机完成，图片不会上传。<br>
    转换结果自动保存到「相册 / 文件转换助手」文件夹。
  </div>
</div>

<script>
(function () {
  "use strict";

  var items = [];           // {file, url, status, outName}
  var fmt = "png";
  var converting = false;

  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $("fileInput"), grid = $("grid"), pickZone = $("pickZone");
  var btnConvert = $("btnConvert"), btnClear = $("btnClear");
  var progressWrap = $("progressWrap"), progressBar = $("progressBar"), progressText = $("progressText");
  var banner = $("banner");

  var FMT_MIME = { jpg: "image/jpeg", png: "image/png", webp: "image/webp" };
  var FMT_EXT = { jpg: ".jpg", png: ".png", webp: ".webp" };

  // ---------- 选择图片 ----------
  pickZone.addEventListener("click", function () {
    if (converting) return;
    fileInput.value = "";
    fileInput.click();
  });
  fileInput.addEventListener("change", function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    files.forEach(function (f) {
      if (items.length >= 30) {
        showBanner("最多一次处理 30 张图片");
        return;
      }
      items.push({ file: f, url: URL.createObjectURL(f), status: "ready" });
    });
    render();
  });

  function render() {
    grid.innerHTML = "";
    items.forEach(function (it, i) {
      var cell = document.createElement("div");
      cell.className = "thumb";
      var img = document.createElement("img");
      img.src = it.url;
      cell.appendChild(img);
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = it.file.name;
      cell.appendChild(name);
      if (it.status === "ready") {
        var del = document.createElement("button");
        del.className = "del"; del.textContent = "✕";
        del.addEventListener("click", function () {
          items.splice(i, 1);
          render();
        });
        cell.appendChild(del);
      } else {
        var st = document.createElement("div");
        st.className = "state " + (it.status === "done" ? "done" : "fail");
        st.textContent = it.status === "done" ? "✓" : it.msg || "失败";
        cell.appendChild(st);
      }
      grid.appendChild(cell);
    });
    btnConvert.disabled = converting || items.length === 0;
    btnConvert.textContent = converting ? "转换中…" : ("开始转换（" + items.length + " 张）");
    btnClear.style.display = items.length ? "inline-block" : "none";
  }

  // ---------- 格式选择 ----------
  var chips = document.querySelectorAll(".chip");
  chips.forEach(function (c) {
    c.addEventListener("click", function () {
      chips.forEach(function (x) { x.classList.remove("on"); });
      c.classList.add("on");
      fmt = c.getAttribute("data-fmt");
      $("qualityRow").style.display = (fmt === "jpg" || fmt === "webp") ? "flex" : "none";
    });
  });
  $("qualityRange").addEventListener("input", function () {
    $("qualityVal").textContent = this.value + "%";
  });

  // ---------- 转换 ----------
  btnConvert.addEventListener("click", function () {
    if (converting || items.length === 0) return;
    var ready = items.filter(function (it) { return it.status === "ready"; });
    if (ready.length === 0) { showBanner("没有待转换的图片"); return; }
    converting = true;
    render();
    progressWrap.style.display = "block";
    runQueue(ready, 0);
  });

  btnClear.addEventListener("click", function () {
    if (converting) return;
    items = [];
    render();
    progressWrap.style.display = "none";
  });

  function runQueue(queue, idx) {
    if (idx >= queue.length) {
      converting = false;
      render();
      var ok = queue.filter(function (x) { return x.status === "done"; }).length;
      progressText.textContent = "完成 " + ok + "/" + queue.length + " 张 ✓";
      progressBar.style.width = "100%";
      showBanner("转换完成，结果已保存到「相册/文件转换助手」", "#dcfce7", "#166534");
      return;
    }
    var it = queue[idx];
    progressText.textContent = "转换中 " + (idx + 1) + "/" + queue.length + "：" + it.file.name;
    progressBar.style.width = (idx / queue.length * 100) + "%";

    convertImage(it).then(function (result) {
      it.status = "done";
      it.outName = result.fileName;
      saveResult(result);
      progressBar.style.width = ((idx + 1) / queue.length * 100) + "%";
      runQueue(queue, idx + 1);
    }).catch(function (e) {
      it.status = "fail";
      it.msg = e && e.message ? e.message : "转换失败";
      runQueue(queue, idx + 1);
    });
  }

  function convertImage(it) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        try {
          var scale = parseFloat($("scaleSel").value) || 1;
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          if (fmt === "jpg") {
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
          }
          ctx.drawImage(img, 0, 0, w, h);
          var mime = FMT_MIME[fmt];
          var quality = (fmt === "jpg" || fmt === "webp")
            ? (parseInt($("qualityRange").value, 10) || 90) / 100 : undefined;
          canvas.toBlob(function (blob) {
            if (!blob) { reject(new Error("浏览器不支持该格式编码")); return; }
            var reader = new FileReader();
            reader.onload = function () {
              var base64 = String(reader.result).split(",")[1];
              var base = it.file.name.replace(/\.[^.]+$/, "");
              var fileName = base + FMT_EXT[fmt];
              resolve({ base64: base64, fileName: fileName, mime: mime });
            };
            reader.onerror = function () { reject(new Error("读取结果失败")); };
            reader.readAsDataURL(blob);
          }, mime, quality);
        } catch (e) { reject(e); }
      };
      img.onerror = function () { reject(new Error("无法读取图片")); };
      img.src = it.url;
    });
  }

  // 保存：优先 Android 原生桥，浏览器环境回退到下载
  function saveResult(result) {
    if (window.AndroidSaver) {
      AndroidSaver.saveImage(result.base64, result.fileName, result.mime);
    } else {
      try {
        var bytes = atob(result.base64);
        var arr = new Uint8Array(bytes.length);
        for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        var blob = new Blob([arr], { type: result.mime });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = result.fileName;
        a.click();
      } catch (e) { /* 浏览器限制下载时静默 */ }
    }
  }

  function showBanner(msg, bg, color) {
    banner.style.display = "block";
    banner.textContent = msg;
    if (bg) banner.style.background = bg;
    if (color) banner.style.color = color;
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(function () { banner.style.display = "none"; }, 4000);
  }
})();
</script>
</body>
</html>
